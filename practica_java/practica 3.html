<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .primario{
            background-color: rgb(219, 130, 70);
        }

        .secundario{
            background-color: #badd8c;
        }
    </style>
</head>
<body>
    <button id="btn" onclick="saludar()"> Saludar</button> 
    <div id="cajita" class="primario">Hola gente bonita</div>
   

    <script>

        let boton = document.getElementById("btn");
        boton = document.getElementById

        let caja = document.getElementById("cajita")
        caja.addEventListener("mouseover", color);

        boton.addEventListener("click", saludar);


        function saludar() {
            alert ("saludito (👉ﾟヮﾟ)👉")
        }

        function color(){
            document.getElementById("cajita").classList.toggle("primario");
            document.getElementById("cajita").classList.toggle("secundario")
        }
    </script>
</body>
</html>
